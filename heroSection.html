<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f4f4f4;
        }

        .hero{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: linear-gradient(to right, #48040e, #873767);
            color: white;
        }

        .hero-container{
            display: flex;
            align-items: center;
            gap: 50px;
            max-width: 1200px;
            width: 100%;
        }

        .hero-text h1{
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero-text p{
            font-size: 20px;
            margin-bottom: 10px;
            color: #d1d5db;
        }

        .tagline{
            font-weight: bold;
            color: #38bdf8;
        }

        .hero-image img{
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
        }

        @media(max-width: 768px){
            .hero-container{
                flex-direction: column-reverse;
                text-align: center;
            }

            .hero-text h1{
                font-size: 38px;
            }

            .hero-text p{
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <section class="hero">

        <div class="hero-container">

            <div class="hero-text">
                <h1>Hi, I'm Nicole Kylie Francisco</h1>

                <p>
                   Turning imagination into reality through code and digital art.
                </p>

                <p class="tagline">
                    2nd Year IT Student | Aspiring Developer & Artist
                </p>
            </div>

            <div class="hero-image">
                <img src="me.jpg" alt="Profile Photo">
            </div>

        </div>

    </section>

</body>
</html>
